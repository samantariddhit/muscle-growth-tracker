<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physique Tracker - Cloud Sync</title>
    <!-- PWA Manifest & Icon -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.png">
    <meta name="theme-color" content="#09090b">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans antialiased flex flex-col items-center py-8 px-4">

    <div class="w-full max-w-md space-y-6">
        <!-- Header -->
        <header class="text-center space-y-1">
            <h1 class="text-2xl font-bold tracking-tight">Physique Tracker</h1>
            <p id="headerTargetLabel" class="text-xs text-zinc-400">Target: Custom Dream Physique</p>
        </header>

        <!-- Custom Targets Configuration Card -->
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 shadow-xl space-y-3">
            <div class="flex justify-between items-center cursor-pointer" onclick="toggleTargetEditor()">
                <h2 class="text-xs font-semibold text-zinc-300 uppercase tracking-wider">🎯 Set Your Dream Targets</h2>
                <span id="toggleText" class="text-xs text-zinc-500 hover:text-zinc-300 underline">Edit Goals</span>
            </div>
            
            <div id="targetEditorContainer" class="hidden space-y-3 pt-2 border-t border-zinc-800">
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-[10px] text-zinc-400 mb-1">Target Wt (kg)</label>
                        <input type="number" step="0.1" id="targetWeight" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2 text-xs text-zinc-100 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] text-zinc-400 mb-1">Target Chest</label>
                        <input type="number" step="0.1" id="targetChest" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2 text-xs text-zinc-100 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] text-zinc-400 mb-1">Target Arms</label>
                        <input type="number" step="0.1" id="targetArms" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2 text-xs text-zinc-100 focus:outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-[10px] text-zinc-400 mb-1">Target Thighs</label>
                        <input type="number" step="0.1" id="targetThighs" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2 text-xs text-zinc-100 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] text-zinc-400 mb-1">Target Calves</label>
                        <input type="number" step="0.1" id="targetCalves" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2 text-xs text-zinc-100 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] text-zinc-400 mb-1">Max Waist</label>
                        <input type="number" step="0.1" id="targetWaist" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2 text-xs text-zinc-100 focus:outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-1 gap-2">
                    <div>
                        <label class="block text-[10px] text-zinc-400 mb-1">Target BF (%)</label>
                        <input type="number" step="0.1" id="targetBf" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2 text-xs text-zinc-100 focus:outline-none">
                    </div>
                </div>
                <button onclick="saveCustomTargets()" class="w-full bg-zinc-800 text-zinc-200 font-medium py-1.5 rounded-lg text-xs hover:bg-zinc-700 transition">
                    Save Custom Targets
                </button>
            </div>
        </div>

        <!-- Input Form Card -->
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 shadow-xl space-y-4">
            <h2 class="text-sm font-semibold text-zinc-300 uppercase tracking-wider">Log New Measurements</h2>
            
            <form id="trackerForm" class="space-y-3">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">Current Weight (kg)</label>
                        <input type="number" step="0.1" id="weight" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-sm text-zinc-100 focus:outline-none focus:border-zinc-600">
                    </div>
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">Height (Ft / In)</label>
                        <div class="grid grid-cols-2 gap-1">
                            <input type="number" id="heightFt" placeholder="ft" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-sm text-zinc-100 focus:outline-none focus:border-zinc-600">
                            <input type="number" id="heightIn" placeholder="in" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-sm text-zinc-100 focus:outline-none focus:border-zinc-600">
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">Chest (inches)</label>
                        <input type="number" step="0.1" id="chest" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-sm text-zinc-100 focus:outline-none focus:border-zinc-600">
                    </div>
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">Arms (inches)</label>
                        <input type="number" step="0.1" id="arms" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-sm text-zinc-100 focus:outline-none focus:border-zinc-600">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">Thighs (inches)</label>
                        <input type="number" step="0.1" id="thighs" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-sm text-zinc-100 focus:outline-none focus:border-zinc-600">
                    </div>
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">Calves (inches)</label>
                        <input type="number" step="0.1" id="calves" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-sm text-zinc-100 focus:outline-none focus:border-zinc-600">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">Waist (inches)</label>
                        <input type="number" step="0.1" id="waist" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-sm text-zinc-100 focus:outline-none focus:border-zinc-600" oninput="calculateBodyFatLocally()">
                    </div>
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">Neck (inches)</label>
                        <input type="number" step="0.1" id="neck" placeholder="Optional" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-sm text-zinc-100 focus:outline-none focus:border-zinc-600" oninput="calculateBodyFatLocally()">
                    </div>
                </div>

                <!-- Est Body Fat Preview -->
                <div class="flex justify-between items-center bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-sm">
                    <span class="text-xs text-zinc-400">Est. Body Fat:</span>
                    <span id="bfResult" class="text-zinc-400 font-medium">-- %</span>
                </div>

                <button type="submit" id="submitBtn" class="w-full mt-2 bg-zinc-100 text-zinc-950 font-medium py-2.5 rounded-lg text-sm hover:bg-zinc-200 transition">
                    Save to Cloud & Compare
                </button>
            </form>
        </div>

        <!-- Remaining Growth Target Card -->
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 shadow-xl space-y-4">
            <h2 class="text-sm font-semibold text-zinc-300 uppercase tracking-wider">Remaining to Dream Physique</h2>
            <div id="remainingStats" class="space-y-3 text-sm">
                <p class="text-xs text-zinc-500 italic">Loading records from Supabase...</p>
            </div>
        </div>

        <!-- Previous Record History -->
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 shadow-xl space-y-3">
            <h2 class="text-sm font-semibold text-zinc-300 uppercase tracking-wider">Previous History</h2>
            <div id="historyList" class="space-y-2 text-sm text-zinc-400">
                <p class="text-xs text-zinc-500 italic">Past entries will appear here.</p>
            </div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW failed', err));
            });
        }

        const SUPABASE_URL = 'https://ystdedlbfrtgddepszgu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_fsK-pY6uGUqP2TUnpP953g_fg3Fd-i5';
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let customTarget = JSON.parse(localStorage.getItem('userPhysiqueTarget')) || { 
            weight: 65, 
            chest: 40, 
            arms: 14.5, 
            thighs: 22,
            calves: 14,
            waist: 30, 
            bodyFat: 11
        };

        function initTargetsUI() {
            document.getElementById('targetWeight').value = customTarget.weight;
            document.getElementById('targetChest').value = customTarget.chest;
            document.getElementById('targetArms').value = customTarget.arms;
            document.getElementById('targetThighs').value = customTarget.thighs || 22;
            document.getElementById('targetCalves').value = customTarget.calves || 14;
            document.getElementById('targetWaist').value = customTarget.waist;
            document.getElementById('targetBf').value = customTarget.bodyFat;
            document.getElementById('headerTargetLabel').textContent = `Target: ${customTarget.weight}kg | ${customTarget.bodyFat}% BF Goal`;
        }

        function toggleTargetEditor() {
            const editor = document.getElementById('targetEditorContainer');
            const toggleText = document.getElementById('toggleText');
            if (editor.classList.contains('hidden')) {
                editor.classList.remove('hidden');
                toggleText.textContent = 'Close';
            } else {
                editor.classList.add('hidden');
                toggleText.textContent = 'Edit Goals';
            }
        }

        function saveCustomTargets() {
            customTarget = {
                weight: parseFloat(document.getElementById('targetWeight').value) || 65,
                chest: parseFloat(document.getElementById('targetChest').value) || 40,
                arms: parseFloat(document.getElementById('targetArms').value) || 14.5,
                thighs: parseFloat(document.getElementById('targetThighs').value) || 22,
                calves: parseFloat(document.getElementById('targetCalves').value) || 14,
                waist: parseFloat(document.getElementById('targetWaist').value) || 30,
                bodyFat: parseFloat(document.getElementById('targetBf').value) || 11
            };
            localStorage.setItem('userPhysiqueTarget', JSON.stringify(customTarget));
            initTargetsUI();
            toggleTargetEditor();
            loadData();
        }

        function heightToMeters(ft, inches) {
            const totalInches = (ft * 12) + (inches || 0);
            return totalInches * 0.0254;
        }

        function calculateBodyFat(waist, neck, heightInches) {
            if (waist && neck && waist > neck && heightInches) {
                let estBf = 86.010 * (Math.log10(waist - neck)) - 70.041 * (Math.log10(heightInches)) + 36.76;
                if (estBf > 3 && estBf < 50) return parseFloat(estBf.toFixed(1));
            }
            return null;
        }

        function calculateBodyFatLocally() {
            const waist = parseFloat(document.getElementById('waist').value);
            const neck = parseFloat(document.getElementById('neck').value);
            const ft = parseFloat(document.getElementById('heightFt').value) || 0;
            const ins = parseFloat(document.getElementById('heightIn').value) || 0;
            const totalInches = (ft * 12) + ins;
            
            const bfResult = document.getElementById('bfResult');
            const bfVal = calculateBodyFat(waist, neck, totalInches);

            if (bfVal !== null) {
                bfResult.textContent = bfVal + '%';
                bfResult.className = 'text-emerald-400 font-medium';
            } else {
                bfResult.textContent = '-- %';
                bfResult.className = 'text-zinc-400 font-medium';
            }
        }

        async function loadData() {
            const { data: logs, error } = await _supabase
                .from('physique_logs')
                .select('*')
                .order('created_at', { ascending: true });

            if (error) {
                console.error('Error fetching logs:', error);
                document.getElementById('remainingStats').innerHTML = `<p class="text-xs text-red-400">Error connecting to Supabase.</p>`;
                return;
            }

            renderHistory(logs);
            if (logs && logs.length > 0) {
                renderRemaining(logs[logs.length - 1]);
            } else {
                document.getElementById('remainingStats').innerHTML = `<p class="text-xs text-zinc-500 italic">No records found. Add your first log above!</p>`;
            }
        }

        document.getElementById('trackerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.textContent = 'Saving...';

            const ft = parseFloat(document.getElementById('heightFt').value);
            const ins = parseFloat(document.getElementById('heightIn').value);
            const heightMeters = heightToMeters(ft, ins);
            const weightVal = parseFloat(document.getElementById('weight').value);
            const currentBmi = weightVal / (heightMeters * heightMeters);

            const newEntry = {
                weight: weightVal,
                height_ft: ft,
                height_in: ins,
                bmi: parseFloat(currentBmi.toFixed(1)),
                chest: parseFloat(document.getElementById('chest').value),
                arms: parseFloat(document.getElementById('arms').value),
                thighs: parseFloat(document.getElementById('thighs').value),
                calves: parseFloat(document.getElementById('calves').value),
                waist: parseFloat(document.getElementById('waist').value)
            };

            const { error } = await _supabase.from('physique_logs').insert([newEntry]);

            if (error) {
                alert('Error saving data: ' + error.message);
            } else {
                this.reset();
                document.getElementById('bfResult').textContent = '-- %';
                await loadData();
            }
            submitBtn.textContent = 'Save to Cloud & Compare';
        });

        function renderRemaining(latest) {
            const container = document.getElementById('remainingStats');
            
            const metrics = [
                { key: 'weight', label: 'Weight Goal', unit: 'kg' },
                { key: 'chest', label: 'Chest Goal', unit: 'in' },
                { key: 'arms', label: 'Arms Goal', unit: 'in' },
                { key: 'thighs', label: 'Thighs Goal', unit: 'in' },
                { key: 'calves', label: 'Calves Goal', unit: 'in' },
                { key: 'waist', label: 'Waist Limit', unit: 'in' }
            ];

            let htmlContent = metrics.map(m => {
                const targetVal = customTarget[m.key] !== undefined ? customTarget[m.key] : 0;
                const latestVal = latest[m.key] !== undefined ? latest[m.key] : 0;
                const diff = (targetVal - latestVal).toFixed(1);
                const color = diff > 0 ? 'text-amber-400' : 'text-emerald-400';
                const text = diff > 0 ? `Need +${diff} ${m.unit} more` : `Target reached!`;
                
                return `
                    <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                        <span class="text-zinc-400">${m.label}</span>
                        <span class="font-medium ${color}">${text}</span>
                    </div>
                `;
            }).join('');

            htmlContent += `
                <div class="flex justify-between items-center pt-1">
                    <span class="text-zinc-400">Body Fat Goal</span>
                    <span class="font-medium text-emerald-400 text-xs">Target: ${customTarget.bodyFat}%</span>
                </div>
            `;

            container.innerHTML = htmlContent;
        }

        function renderHistory(logs) {
            const container = document.getElementById('historyList');
            if (!logs || logs.length === 0) return;

            container.innerHTML = logs.slice().reverse().map(log => {
                const dateStr = new Date(log.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                const htDisplay = log.height_ft ? `${log.height_ft}'${log.height_in}"` : '';
                return `
                    <div class="bg-zinc-950 p-3 rounded-lg border border-zinc-800 space-y-2">
                        <div class="flex justify-between text-xs font-semibold text-zinc-300">
                            <span>${dateStr}</span>
                            <span class="text-zinc-500">${htDisplay}</span>
                        </div>
                        <div class="grid grid-cols-3 gap-2 text-xs text-zinc-400">
                            <div>Wt: <span class="text-zinc-200">${log.weight}kg</span></div>
                            <div>Ch: <span class="text-zinc-200">${log.chest || '--'}"</span></div>
                            <div>Ar: <span class="text-zinc-200">${log.arms || '--'}"</span></div>
                        </div>
                        <div class="grid grid-cols-3 gap-2 text-xs text-zinc-400">
                            <div>Th: <span class="text-zinc-200">${log.thighs || '--'}"</span></div>
                            <div>Cl: <span class="text-zinc-200">${log.calves || '--'}"</span></div>
                            <div>Ws: <span class="text-zinc-200">${log.waist}"</span></div>
                        </div>
                        <div class="text-[10px] text-right text-zinc-500 pt-1 border-t border-zinc-900">
                            BMI: <span class="text-zinc-400">${log.bmi || '--'}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.onload = () => {
            initTargetsUI();
            loadData();
        };
    </script>
</body>
</html>
